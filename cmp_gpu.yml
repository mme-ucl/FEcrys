name: cmp_gpu
channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python=3.12              

  # ── CUDA / GPU ────────────────────────────────────────────────────────────
  - cuda-version=12.8        # Replace with relevant version of CUDA
  - cudnn>=9.0,<9.9

  # ── Molecular simulation ──────────────────────────────────────────────────
  - openmm<8.4
  - openmmforcefields>=0.14
  - mdanalysis>=2.10
  - mdtraj=1.10.3
  - parmed>=4.3
  - pymbar>=4.2
  - rdkit>=2025.03
  - openff-toolkit>=0.16
  - pyscal3

  # ── Scientific Python stack ───────────────────────────────────────────────
  - numpy>=2.0,<2.2
  - scipy<1.15               # Limit SciPy version for compatibility with pyboo
  - pandas>=2.0
  - scikit-learn>=1.7
  - statsmodels>=0.14        # additive from fecrys
  - numba>=0.61
  - numexpr>=2.14
  - opt-einsum>=3.4
  - matplotlib>=3.10

  # ── Jupyter ecosystem ─────────────────────────────────────────────────────
  - jupyter
  - jupyterlab
  - ipython

  # ── Utilities ─────────────────────────────────────────────────────────────
  - psutil
  - pyyaml>=6.0
  - pint>=0.23
  - pip

  - pip:
    # Tensorflow must be installed via pip
    - tensorflow[and-cuda]==2.19.1
    - protobuf